<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./images/logo-icon.png"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./sign-up.css" />

    <title>Sign Up</title>
  </head>
  <body class="bg-black text-white">
    <main class="container-fluid custom-main">
      <section class="row">
        <div class="col-12 col-lg-8 mx-lg-auto custom-inner-bg">
          <a href="./index.html">
            <div class="custom-logo-image mb-3 mt-3"></div>
          </a>
          <p class="h5">Start with your free account today.</p>
          <form action="./successful-submission.html" method="get">
            <div class="mb-3">
              <label for="email" class="form-label"
                >Email address <span>*</span>
              </label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
                aria-describedby="emailHelp"
              />
              <div id="emailHelp" class="form-text text-secondary">
                *We'll never share your email with anyone else*
              </div>
            </div>
            <!-- password -->
            <div class="mb-3">
              <label for="password" class="form-label"
                >Password <span>*</span>
              </label>
              <input
                type="password"
                class="form-control"
                name="password"
                id="password"
                required
              />
              <div id="passwordHelp" class="form-text text-secondary">
                *enter strong password*
              </div>
            </div>

            <!-- number -->
            <div class="input-group mt-3 mb-3">
              <span class="input-group-text" id="basic-addon1">+91 </span>
              <input
                type="tel"
                class="form-control"
                placeholder=""
                name="phone"
                id="phone"
                aria-label="phone"
                aria-describedby="basic-addon1"
              />
            </div>
            <!-- check -->
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="check"
                name="check"
                required
              />
              <label class="form-check-label" for="check"
                >I agree to the Terms of Service and Privacy Policy</label
              >
            </div>
            <button type="submit" class="btn btn-primary mb-3">
              SIGN UP FOR FREE
            </button>
          </form>
          <div class="sig-up mt-4">
            <p>
              Already have NOW! account?
              <a href="./login-page.html"> Sign in </a>
            </p>
          </div>
        </div>
      </section>
    </main>
    <footer style="padding-bottom: 0; padding-top: 2rem">
      <div class="container text-center">
        <p>© 2026, Arjun Balachandran . All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
