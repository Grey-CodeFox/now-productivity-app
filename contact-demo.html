    <main class="container-fluid custom-main">
      <!-- request Demo -->
      <section class="custom-request-demo">
        <div class="container custom-demo-container w-75 p-3">
          <div class="d-flex flex-row mt-4">
            <h3 class="h6 text-start">Request a Demo</h3>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-stars"
              viewBox="0 0 16 16"
            >
              <path
                d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 0 0 1.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 0 0-1.828 1.829l-.645 1.936a.361.361 0 0 1-.686 0l-.645-1.937a2.89 2.89 0 0 0-1.828-1.828l-1.937-.645a.361.361 0 0 1 0-.686l1.937-.645a2.89 2.89 0 0 0 1.828-1.828zM3.794 1.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387A1.73 1.73 0 0 0 4.593 5.69l-.387 1.162a.217.217 0 0 1-.412 0L3.407 5.69A1.73 1.73 0 0 0 2.31 4.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387A1.73 1.73 0 0 0 3.407 2.31zM10.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732L9.1 2.137a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"
              />
            </svg>
          </div>
          <h3 class="h4 text-center mt-4">
            To schedule a product demo with one of our product consultants,
            Please fill in your contact details
          </h3>
          <form action="successful-submission.html" class="row" method="get">
            <!-- First name -->
            <div class="mb-3 col-lg-6">
              <label for="first-name" class="form-label"
                >First Name <span>*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="first-name"
                name="last-name"
                required
              />
            </div>

            <!-- Last name -->
            <div class="mb-3 col-lg-6">
              <label for="last-name" class="form-label"
                >Last Name <span>*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="last-name"
                name="last-name"
                required
              />
            </div>
            <!-- Email -->
            <div class="mb-3">
              <label for="last-name" class="form-label"
                >Email <span>*</span></label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
              />
            </div>
            <!-- text area -->
            <div class="mb-3">
              <label for="user-message" class="form-label"
                >Type Your Message Here....</label
              >
              <textarea
                class="form-control"
                id="user-message"
                rows="3"
                name="user-message"
              ></textarea>
            </div>
            <div>
              <button class="btn btn-primary" type="submit">Submit form</button>
            </div>
          </form>
        </div>
      </section>

      <!-- FOOTER SECTION -->
      <footer style="padding-bottom: 0; padding-top: 2rem">
        <div class="container text-center">
          <p>© 2026, Arjun Balachandran . All Rights Reserved.</p>
        </div>
      </footer>
    </main>
  </body>
</html>
