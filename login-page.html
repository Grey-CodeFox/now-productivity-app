<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./images/logo-icon.png"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./login-page.css" />

    <title>Login</title>
  </head>
  <body class="bg-black text-white">
    <main class="container-fluid custom-main">
      <section class="row">
        <div
          class="col-12 col-lg-8 mx-lg-auto"
          style="backdrop-filter: blur(5px); box-shadow: 1px 1px 5px black"
        >
          <a href="./index.html">
            <div class="custom-logo-image mb-3 mt-3"></div>
          </a>
          <p class="h3 mt-3">Login To Your Workspace</p>
          <div class="custom-logiDet-container mt-3">
            <form action="/successful-submission.html" method="get">
              <div class="input-container">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Email Address or Mobile Number"
                  aria-label="login"
                  name="login"
                  id="login"
                  required
                />
              </div>
              <div class="button-custom mt-3">
                <button class="btn w-100 btn-primary" type="submit">
                  Next
                </button>
              </div>
            </form>
          </div>
          <!-- signin other way -->
          <div class="custom-logiDet-container mt-3">
            <p class="h5 fw-light">Sign in using</p>
            <div class="custom-i-container">
              <div class="custom-i custom-i-1"></div>
              <div class="custom-i custom-i-2"></div>
              <div class="custom-i custom-i-3"></div>
              <div class="custom-i custom-i-4"></div>
              <div class="custom-i custom-i-5"></div>
            </div>
          </div>
          <div class="sig-up mt-4">
            <p>
              Don't have a NOW! account?
              <a href="./sign-up.html"> Sign up now </a>
            </p>
          </div>
        </div>
      </section>
    </main>
    <footer style="padding-bottom: 0; padding-top: 2rem">
      <div class="container text-center">
        <p>© 2026, Arjun Balachandran . All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
